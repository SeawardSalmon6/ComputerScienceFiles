<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About Me</title>
    </head>
    <body>
        <component type="navbar"></component>
        <h1>Join us</h1>
        <p>Fill your info below:</p>
        <form id="register-form">
            <fieldset>
                <label for="name">
                    <span>Name:</span>
                    <input type="text" name="name" id="name" required />
                </label>
                <br />
                <br />
                <label for="email">
                    <span>Email:</span>
                    <input type="email" name="email" id="email" required />
                </label>
            </fieldset>
            <br />
            <button type="submit">Submit</button>
        </form>

        <script src="js/main.js" type="text/javascript"></script>
        <script src="js/components.js" type="text/javascript"></script>

        <script>
            function formSubmit(e) {
                e.preventDefault();

                const form = document.getElementById("register-form");
                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                const DB_KEY = `users`;
                const db = JSON.parse(
                    atob(window.localStorage.getItem(DB_KEY) || btoa("[]"))
                );

                const users = db || [];
                const isEmailAlreadyInUse = users.some(
                    (u) => u.email === data.email
                );

                if (isEmailAlreadyInUse) {
                    alert(`This email is already in use! (${data.email})`);
                    return;
                }

                window.localStorage.setItem(
                    DB_KEY,
                    btoa(JSON.stringify(users.concat(data)))
                );

                alert(`Welcome to our site, ${data.name}! You can log in now.`);
                window.location.href = "/";
            }

            const form = document.getElementById("register-form");
            form.addEventListener("submit", formSubmit);
        </script>
    </body>
</html>
